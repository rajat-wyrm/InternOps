[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.51.0",
    "redis>=6.0.0",
    "asyncpg>=0.31.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:.*httpx.*starlette.testclient.*:DeprecationWarning",
    "ignore:.*httpx.*starlette.testclient.*:Warning",
    "ignore:Fallback provider.*lacks a valid API key.*:RuntimeWarning"
]