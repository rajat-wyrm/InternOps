name: Auto Format Code
on:
  pull_request:
    branches: [master]
  push:
    # Run on all branches so formatting happens on your fork before/during PR
    branches:
      - '**'
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting on pull requests
        if: github.event_name == 'pull_request'
        run: npx prettier --check .
      - name: Format code on branch pushes
        if: github.event_name == 'push'
        run: npx prettier --write .
      - name: Commit formatted code on branch pushes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: automatically format code with Prettier'
