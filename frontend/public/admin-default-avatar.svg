<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">InternOps administrator default avatar</title>
  <desc id="desc">A balanced indigo administrator avatar with a centered shield and dashboard tiles.</desc>
  <defs>
    <linearGradient id="admin-bg" x1="84" y1="68" x2="426" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.52" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="admin-shield" x1="160" y1="142" x2="354" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
