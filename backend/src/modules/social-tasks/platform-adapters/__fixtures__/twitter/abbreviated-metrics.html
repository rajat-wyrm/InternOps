<!-- Synthetic fixture: engagement counts shown in abbreviated form,
     as X's UI does once numbers get large (e.g. "1.2K", "3M"). -->
<html>
  <body>
    <article data-testid="tweet">
      <div data-testid="User-Name">
        <span>Popular Account</span>
        <span>@popular_account</span>
      </div>
      <div data-testid="tweetText">
        <span>This one really took off. Thanks for reading!</span>
      </div>
      <div data-testid="reply" aria-label="1.2K Replies">1.2K</div>
      <div data-testid="retweet" aria-label="3.4K reposts">3.4K</div>
      <div data-testid="like" aria-label="45.6K Likes">45.6K</div>
    </article>
  </body>
</html>
