<!doctype html>
<html>
  <body>
    <div data-testid="primaryColumn">
      <article data-testid="tweet">
        <div data-testid="tweetText">
          <span>Sharing my latest open-source contribution!</span>
        </div>
        <div role="group" aria-label="post engagement">
          <div data-testid="like"><span>301</span></div>
          <div data-testid="retweet"><span>42</span></div>
        </div>
      </article>
    </div>
    <section data-testid="reply-thread">
      <article data-testid="tweet">
        <div data-testid="tweetText">
          <span>Nice work, congrats on shipping this!</span>
        </div>
      </article>
      <article data-testid="tweet">
        <div data-testid="tweetText">
          <span>Following the repo, keep it up.</span>
        </div>
      </article>
    </section>
  </body>
</html>
